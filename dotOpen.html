        </div>
    </div>

    <div class="sidebar-out">
        <div class="sidebar">

            <div class="sidebar-heading">
                    <!--<i class="fa fa-arrow-left" id="sidebar-close-btn" aria-hidden="true"></i> -->
                    <div>Days</div> 
            </div>

            <div class="sidebar-menu">
                <a class="sidebar-menu-item" href="./index.html">
                    <i class="fa fa-home" aria-hidden="true"></i>
                    Home
                </a>
                <a class="sidebar-menu-item" href="./goals.html">
                    <i class="fa fa-trophy" aria-hidden="true"></i>
                    Goals
                </a>
                <a class="sidebar-menu-item" href="./">
                    <i class="fa fa-line-chart" aria-hidden="true"></i>
                    Statistics
                </a>
                <a class="sidebar-menu-item" href="./">
                    <i class="fa fa-tree" aria-hidden="true"></i>
                    Progress Tree
                </a>
                <a class="sidebar-menu-item" href="./">
                    <i class="fa fa-cog" aria-hidden="true"></i>
                    Settings
                </a>
                <a class="sidebar-menu-item" href="./about.html">
                    <i class="fa fa-info-circle" aria-hidden="true"></i>
                    About
                </a>
            </div>

            <div class="sidebar-debug">
                <div class="sidebar-debug-heading">
                    Debug Tools
                </div>
                <div class="sidebar-debug-menu">
                    <div>Current Date</div>
                    <div>Clear Database</div>
                </div>
            </div>
            
        </div>
    </div>
    
    <div class="calender-out">
        <div class="calender-total">
            <div class="calender-back-out">
                <button class="calender-back">
                    <i class="fa fa-arrow-left" aria-hidden="true"></i>
                </button>
            </div>
            <div class="calender">
                <div class="calender-head">
                    <div class="calender-head-right">
                        <div class="calender-month">JANUARY</div>
                        <div class="calender-year">2026</div>
                    </div>
                    <div class="calender-head-left">
                        <div class="calender-change">
                            <button class="calender-change-btn" id="calender-change-left">
                                <i class="fa fa-chevron-left" aria-hidden="true"></i>
                            </button>
                            <button class="calender-change-btn" id="calender-change-right">
                                <i class="fa fa-chevron-right" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="calender-days">
                    <div class="calender-day">Sun</div>
                    <div class="calender-day">Mon</div>
                    <div class="calender-day">Tue</div>
                    <div class="calender-day">Wed</div>
                    <div class="calender-day">Thu</div>
                    <div class="calender-day">Fri</div>
                    <div class="calender-day">Sat</div>
                </div>
                <div class="calender-dots">
                    <div class="calender-dot"></div>
                    <div class="calender-dot"></div>
                    <div class="calender-dot"></div>
                    <div class="calender-dot"></div>
                    <div class="calender-dot"></div>
                    <div class="calender-dot">1</div>
                    <div class="calender-dot">2</div>
                    <div class="calender-dot">3</div>
                    <div class="calender-dot">4</div>
                    <div class="calender-dot">5</div>
                    <div class="calender-dot">6</div>
                    <div class="calender-dot">7</div>
                    <div class="calender-dot">8</div>
                    <div class="calender-dot">9</div>
                    <div class="calender-dot">10</div>
                    <div class="calender-dot">11</div>
                    <div class="calender-dot">12</div>
                    <div class="calender-dot">13</div>
                    <div class="calender-dot">14</div>
                    <div class="calender-dot">15</div>
                    <div class="calender-dot">16</div>
                    <div class="calender-dot">17</div>
                    <div class="calender-dot">18</div>
                    <div class="calender-dot">19</div>
                    <div class="calender-dot">20</div>
                    <div class="calender-dot">21</div>
                    <div class="calender-dot">22</div>
                    <div class="calender-dot">23</div>
                    <div class="calender-dot">24</div>
                    <div class="calender-dot">25</div>
                    <div class="calender-dot">26</div>
                    <div class="calender-dot">27</div>
                    <div class="calender-dot">28</div>
                    <div class="calender-dot">29</div>
                    <div class="calender-dot">30</div>
                </div>
            </div>
        </div>
        <div class="calender-setter" id="calender-setter">
            <div class="calender-setter-head">April 09, 2026 (Thursday)</div>
            <div class="category-out">
                <div class="category-head">Category</div>
                <div class="categories">
                    <div class="category productive">
                        <div class="category-color productive"></div>
                        <div class="category-name">Productive</div>
                    </div>
                    <div class="category neutral">
                        <div class="category-color neutral"></div>
                        <div class="category-name">Neutral</div>
                    </div>
                    <div class="category wasted">
                        <div class="category-color wasted"></div>
                        <div class="category-name">Wasted</div>
                    </div>
                    <div class="category vacation">
                        <div class="category-color vacation"></div>
                        <div class="category-name">Vacation</div>
                    </div>
                </div>
            </div>
            <div class="note-out">
                <div class="note-head">Note</div>
                <div class="note">
                    <textarea name="note" id="note" placeholder="Add a note..."></textarea>
                </div>
            </div>

            <button class="save-btn">Save</button>
        </div>
    </div>

    

</body>

<script src="./js/db.js"></script>
<script src="./js/sidebar.js"></script>
