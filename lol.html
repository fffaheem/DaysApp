<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Color Extractor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Segoe UI,Arial,sans-serif;
}

body{
    background:#111827;
    color:white;
    min-height:100vh;
    padding:40px;
}

h1{
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    color:#9CA3AF;
    margin-bottom:30px;
}

textarea{

    width:100%;
    height:220px;

    background:#1F2937;

    color:white;

    border:none;

    outline:none;

    border-radius:18px;

    padding:20px;

    resize:vertical;

    font-size:15px;

    line-height:1.6;

}

.toolbar{

    display:flex;

    gap:15px;

    align-items:center;

    margin:20px 0;

    flex-wrap:wrap;

}

button{

    background:#2563EB;

    color:white;

    border:none;

    padding:12px 28px;

    border-radius:12px;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

    transition:.25s;

}

button:hover{

    background:#1D4ED8;

    transform:translateY(-2px);

}

#count{

    margin-left:auto;

    color:#9CA3AF;

    font-size:15px;

}

#colorcontainer{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));

    gap:20px;

}

.card{

    border-radius:18px;

    overflow:hidden;

    background:#1F2937;

    transition:.25s;

    cursor:pointer;

    box-shadow:0 10px 30px rgba(0,0,0,.35);

}

.card:hover{

    transform:translateY(-6px);

}

.preview{

    height:130px;

}

.info{

    padding:16px;

}

.code{

    font-family:Consolas,monospace;

    word-break:break-all;

    margin-bottom:8px;

}

.small{

    color:#9CA3AF;

    font-size:13px;

}

.toast{

    position:fixed;

    bottom:30px;

    right:30px;

    background:#16A34A;

    color:white;

    padding:12px 20px;

    border-radius:10px;

    opacity:0;

    pointer-events:none;

    transition:.3s;

}

.toast.show{

    opacity:1;

}

</style>

</head>
<body>

<h1>🎨 Premium Color Extractor</h1>

<div class="subtitle">
Paste any source code, CSS, Flutter, HTML, QML, JSON or random text.
</div>

<textarea id="input" placeholder="Paste code here..."></textarea>

<div class="toolbar">

<button id="extract">
Extract Colors
</button>

<button id="clear">
Clear
</button>

<div id="count">
0 colors found
</div>

</div>

<div id="colorcontainer"></div>

<div id="toast" class="toast">
Copied!
</div>

<script>

const input=document.getElementById("input");
const extract=document.getElementById("extract");
const clear=document.getElementById("clear");
const container=document.getElementById("colorcontainer");
const count=document.getElementById("count");
const toast=document.getElementById("toast");

function showToast(text){

    toast.innerText=text;

    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },1200);

}

function contrast(hex){

    if(!hex.startsWith("#"))
        return "#FFFFFF";

    hex=hex.substring(1);

    if(hex.length==3)
        hex=hex.split("").map(x=>x+x).join("");

    if(hex.length<6)
        return "#FFFFFF";

    const r=parseInt(hex.substring(0,2),16);

    const g=parseInt(hex.substring(2,4),16);

    const b=parseInt(hex.substring(4,6),16);

    const brightness=(r*299+g*587+b*114)/1000;

    return brightness>160?"#000":"#FFF";

}

function flutterToCss(color){

    let hex=color.substring(2);

    if(hex.length===8)
        return "#"+hex.substring(2);

    return color;

}

function extractColors(text){

    const regexes=[

        /#[0-9A-Fa-f]{3,8}\b/g,

        /0x[0-9A-Fa-f]{8}\b/g,

        /rgba?\([^)]+\)/g

    ];

    let colors=[];

    regexes.forEach(r=>{

        const found=text.match(r);

        if(found)
            colors.push(...found);

    });

    colors=colors.map(c=>{

        if(c.startsWith("0x"))
            return flutterToCss(c);

        return c;

    });

    colors=[...new Set(colors)];

    colors.sort();

    return colors;

}

function render(){

    const colors=extractColors(input.value);

    container.innerHTML="";

    count.innerText=colors.length+" colors found";

    colors.forEach(color=>{

        const card=document.createElement("div");

        card.className="card";

        card.onclick=()=>{

            navigator.clipboard.writeText(color);

            showToast(color+" copied");

        };

        const preview=document.createElement("div");

        preview.className="preview";

        preview.style.background=color;

        const info=document.createElement("div");

        info.className="info";

        preview.style.color=contrast(color);

        info.innerHTML=`

            <div class="code">${color}</div>

            <div class="small">Click to copy</div>

        `;

        card.appendChild(preview);

        card.appendChild(info);

        container.appendChild(card);

    });

}

extract.onclick=render;

clear.onclick=()=>{

    input.value="";

    container.innerHTML="";

    count.innerText="0 colors found";

};

input.addEventListener("keydown",e=>{

    if(e.ctrlKey && e.key==="Enter")
        render();

});

</script>

</body>
</html>
