	<!--font awesome-->

	<!--fonts ezcar-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400..800&display=swap" rel="stylesheet">

<body>
    <div class="topbar">
        <div class="left">
            <i class="fa fa-bars" aria-hidden="true"></i>
            <h1 class="title-topbar">Home</h1>
        </div>
        <div class="right">
            <div class="year">2026 (Current)</div>
            <i class="fa fa-caret-down" aria-hidden="true"></i>
        </div>
    </div>

    <div class="head">
        <div class="head-top">
            <div class="head-percentage">54.2%</div>
            <div>of 2026 Gone</div>
        </div>
        <div class="head-middle">
            <div class="head-time">167d 19h 46m 23s</div>
            <div>TIME REMAINING</div>
        </div>
        <div class="head-bottom">
            <div class="head-bottom-up">
                <div class="head-bottom-elapsed"> <span>Elapesed:</span> <span>198 </span> </div>
                <div class="head-bottom-left"> <span>Left:</span> <span>167</span> </div>
                <div class="head-bottom-percentage">45.8%</div>
            </div>
            <div class="progressbar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>
    
    <div class="dotout">
        
    </div>
    <div class="statsout">
        
    </div>
